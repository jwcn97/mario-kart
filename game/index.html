<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kart Racer Game</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/shared/theme.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="practice">
    <!-- The 3D world fills the screen; everything else floats on top. -->
    <canvas id="scene"></canvas>
    <div id="speedlines" class="speedlines" aria-hidden="true"></div>

    <!-- Join panel: QR code + room code (Q hides it) -->
    <section id="join" class="panel join" aria-label="Join this game">
      <div id="qr" class="qr" aria-label="QR code to join"></div>
      <div class="join-text">
        <div class="join-title">Scan to join</div>
        <div class="code-label">Room</div>
        <div id="room-code" class="room-code">····</div>
        <p id="join-url" class="join-url"></p>
        <p id="join-warning" class="join-warning" hidden></p>
      </div>
    </section>

    <!-- Race status, top centre -->
    <section id="race-panel" class="panel race-panel" aria-live="polite">
      <div id="race-title" class="race-title">Practice</div>
      <div id="race-sub" class="race-sub"></div>
      <button id="start-race" class="btn small" type="button">Start race</button>
    </section>

    <div class="top-right">
      <span id="camera-chip" class="chip">auto camera</span>
      <span id="server-chip" class="chip">connecting…</span>
    </div>

    <!-- Countdown, "FINAL LAP", "WRONG WAY": big centred messages -->
    <div id="countdown" class="countdown" hidden></div>
    <div id="alerts" class="alerts" aria-live="assertive"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- Results after a race -->
    <section id="results" class="panel results" hidden>
      <h2 id="results-title">Results</h2>
      <table>
        <thead>
          <tr><th></th><th>Driver</th><th>Time</th><th>Best lap</th></tr>
        </thead>
        <tbody id="results-rows"></tbody>
      </table>
      <p class="results-hint"><kbd>Space</kbd> race again · <kbd>R</kbd> back to practice</p>
    </section>

    <canvas id="minimap" class="panel minimap" aria-label="Track map"></canvas>

    <!-- One chip per kart: place, laps, speed, input -->
    <section id="hud" class="hud" aria-label="Players"></section>

    <!-- Phase 2 connection stats (I toggles) -->
    <section id="debug" class="panel debug" hidden>
      <table>
        <thead>
          <tr><th>Player</th><th>Input</th><th>Msgs/s</th><th>Phone ⇄ server</th><th>Tilt → screen</th><th>Last input</th></tr>
        </thead>
        <tbody id="debug-rows"></tbody>
      </table>
      <p id="debug-footer" class="debug-footer"></p>
    </section>

    <p class="keys">
      <kbd>Space</kbd> start race · <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> + <kbd>Right ⇧</kbd> P1 ·
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> + <kbd>Left ⇧</kbd> P2 · <kbd>C</kbd> camera · <kbd>R</kbd> reset ·
      <kbd>Q</kbd> join · <kbd>G</kbd> gates · <kbd>T</kbd> tuning · <kbd>I</kbd> stats
    </p>

    <div id="banner" class="banner" role="alert" hidden></div>

    <template id="hud-chip">
      <article class="player">
        <span class="badge"></span>
        <span class="place"></span>
        <div class="speed"><span class="kmh">0</span><small>km/h</small></div>
        <div class="meta">
          <span class="source"></span>
          <div class="steer"><div class="steer-centre"></div><div class="steer-fill"></div></div>
          <div class="pedals"><span class="gas">GAS</span><span class="brake">BRAKE</span><span class="charge"></span></div>
        </div>
        <div class="laps">
          <span class="lap"></span>
          <span class="laptime"></span>
          <span class="best"></span>
        </div>
      </article>
    </template>

    <script type="module" src="./main.js"></script>
  </body>
</html>
